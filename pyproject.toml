[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bring-mcp-server"
version = "0.1.0"
description = "MCP Server for Bring! Shopping List integration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.1.2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/AndreClaassen1/bring-mcp-server"
Repository = "https://github.com/AndreClaassen1/bring-mcp-server"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
bring-mcp = "bring_mcp.server:main"
